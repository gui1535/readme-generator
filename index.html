<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monte READMEs profissionais para seus projetos do GitHub, bloco por bloco." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>README Builder</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28" />README Builder</div>
      <div class="toolbar" id="toolbar"></div>
    </header>

    <main class="builder">
      <aside class="panel library" id="library" aria-label="Biblioteca de componentes"></aside>
      <section class="panel editor" id="editor" aria-label="Estrutura do README"></section>
      <section class="panel preview-panel" id="preview" aria-label="Pré-visualização"></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
